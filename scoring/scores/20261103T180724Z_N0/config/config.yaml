# Judge config. Copied into each scores/<run_id>/ folder. Prompts are plain files (judge/prompts/).
backend: claude_cli          # claude_cli | stub  (codex_cli is not implemented here)
roles:
  judge: {backend: claude_cli, model: claude-opus-5-5}
claude_cli:
  overhead: L2               # --tools "" + replaced system prompt + no skills/MCP/settings
  system_prompt: "Follow the user's instructions exactly."
  timeout_s: 1200
  retry_sleep_s: 5
shuffle_seed: 20261019       # fixed, so every call shares one static prefix (cache-friendly)
repeat:
  seed: 20261019
  per_condition: {C0: 7, C1: 7, C2: 6}
trace:
  shingle: 3                 # word n-gram size
  min_score: 0.3             # below this a candidate is flagged untraced (kept)
